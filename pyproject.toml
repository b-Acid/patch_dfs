[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchdfs"
version = "0.1.0"
description = "Reproduce GDFS / DIME dynamic patch selection and study compute-proportional inference"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.7",
  "torchvision>=0.22",
  "numpy",
  "timm",
  "pyyaml",
  "matplotlib",
  "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
